<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>CN</th>
            <th>CNS</th>
            <th>AI</th>
            <th>Total</th>
            <th>Percentage</th>
            <script>
                let students = [
                    { name: "Hari", cn: 85, cns: 90, ai: 80 },
                    { name: "Uma", cn: 78, cns: 82, ai: 88 },
                    { name: "Siri", cn: 92, cns: 88, ai: 95 }  
                ]; 
                function Total(student) {
                    const total = student.cn + student.dsa + student.os;
                    return total;
                    
                } 
                function Percentage(student) {
                    const total = Total(student);
                    const percentage = (total / 300) * 100; 
                    return percentage;
                }
                students.forEach(student => {
                    const total = Total(student);
                    const percentage = Percentage(student);
                    document.write(`
                        <tr>
                            <td>${student.name}</td>
                            <td>${student.cn}</td>
                            <td>${student.cns}</td>
                            <td>${student.ai}</td>
                            <td>${total}</td>
                            <td>${percentage.toFixed(2)}%</td>
                        </tr>
                    `);
                });

            </script>
        </tr>
    </table>
</body>
</html>
